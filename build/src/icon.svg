<!-- EVE HUD app icon (source for build/icon.png). Same design as eve-hud.ico: teal hexagon reticle on a
     dark rounded square with the "EVE HUD" label. 1024 canvas with the macOS icon grid margin (100 px). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14261f"/><stop offset="1" stop-color="#070d0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#6fe0c4" stop-opacity="0.22"/><stop offset="1" stop-color="#6fe0c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1.4" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#scan)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#6fe0c4" stroke-opacity="0.25" stroke-width="4"/>
  <g fill="#cfe9e1" fill-opacity="0.55">
    <circle cx="190" cy="240" r="3"/><circle cx="260" cy="610" r="2.5"/><circle cx="830" cy="230" r="3"/>
    <circle cx="790" cy="560" r="2.5"/><circle cx="330" cy="190" r="2"/><circle cx="700" cy="170" r="2"/>
    <circle cx="160" cy="470" r="2"/><circle cx="870" cy="420" r="2.5"/><circle cx="420" cy="690" r="2"/>
  </g>
  <g transform="translate(512 420)" fill="none" stroke="#6fe0c4">
    <circle r="250" stroke-opacity="0.35" stroke-width="5" stroke-dasharray="4 14"/>
    <circle r="205" stroke-opacity="0.6" stroke-width="5"/>
    <path d="M0 -265 V-225 M0 225 V265 M-265 0 H-225 M225 0 H265" stroke-width="8" stroke-opacity="0.8"/>
    <path d="M150 -150 L250 -205" stroke-opacity="0.5" stroke-width="4"/>
    <path d="M-150 150 L-235 175" stroke-opacity="0.5" stroke-width="4"/>
    <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z" stroke-width="34" filter="url(#soft)" stroke-opacity="0.6"/>
    <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z" stroke-width="26"/>
    <path d="M0 -100 L87 -50 L87 50 L0 100 L-87 50 L-87 -50 Z" stroke-width="6" stroke-opacity="0.55"/>
    <circle r="52" stroke-width="12"/>
    <circle r="32" fill="#6fe0c4" stroke="none"/>
    <path d="M-34 -78 H34" stroke-width="6" stroke-opacity="0.7"/>
  </g>
  <g fill="#6fe0c4">
    <circle cx="762" cy="215" r="13"/><circle cx="277" cy="595" r="13"/><circle cx="300" cy="330" r="10" fill-opacity="0.8"/>
  </g>
  <text x="512" y="830" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="112" letter-spacing="10" fill="#e9f3ef">EVE HUD</text>
  <path d="M432 870 H592" stroke="#6fe0c4" stroke-width="6" stroke-opacity="0.7"/>
</svg>
