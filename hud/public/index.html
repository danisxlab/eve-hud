<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVE HUD</title>
    <!-- No third-party requests: the font ships with the HUD (public/fonts); images come from CCP/Fenris Creations. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://images.evetech.net; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="/css/hud.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='none' stroke='%234fb08f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234fb08f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <canvas id="plexus" aria-hidden="true"></canvas>
    <header id="topbar"></header>
    <main id="grid" aria-label="HUD modules"></main>
    <aside id="drawer" aria-label="HUD settings" hidden></aside>
    <div id="overlay" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
