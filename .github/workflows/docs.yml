# Publishes the website on GitHub Pages (scripts/build-site.js makes it):
#   https://danisxlab.github.io/eve-hud/documentation/   documentation/index.html
#   https://danisxlab.github.io/eve-hud/demo/            the HUD with sample data, in the browser
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Runs when the documentation or the HUD page changes on main, or by hand
# (Actions → Documentation → Run workflow).
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - 'demo/**'
      - 'hud/public/**'
      - 'hud/lib/**'
      - 'scripts/build-site.js'
      - 'package.json'
      - 'assets/icon.png'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the documentation and the demo, in the same folder layout as the repository
      - name: Build the website
        run: node scripts/build-site.js _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4